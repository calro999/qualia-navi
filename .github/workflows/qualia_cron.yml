name: Monthly Cosme Hub Auto Updater

on:
  schedule:
    # 2時間おきに実行（1回あたり最大3ジャンル×1日8回＝全24ジャンルを1日1商品ずつ追加・育成）
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      target_month:
        description: '対象年月 (YYYY-MM、空欄ならJST現在月・月替わり時は自動作成)'
        required: false
        default: ''
      target_date:
        description: '対象日付 (YYYY-MM-DD、空欄ならJST現在日)'
        required: false
        default: ''
      max_genres:
        description: '1回あたり更新する最大ジャンル数 (デフォルト: 3)'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: monthly-hub-auto-updater
  cancel-in-progress: false

jobs:
  update-monthly-hubs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Monthly Hub Auto Updater (3 genres / run + Monthly Rollover)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          ARGS="--max-genres=${{ github.event.inputs.max_genres || '3' }}"
          if [ -n "${{ github.event.inputs.target_month }}" ]; then
            ARGS="$ARGS --month=${{ github.event.inputs.target_month }}"
          fi
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date=${{ github.event.inputs.target_date }}"
          fi
          node scripts/auto_update_monthly_hubs.mjs $ARGS

      - name: Verify Content Quality, Affiliate Links, Appeal & Layout Integrity
        run: node scripts/verify_monthly_hubs_quality.mjs

      - name: Update Sitemap & IndexNow
        run: node scripts/update-sitemap.mjs || true

      - name: Verify TypeScript Build Safety
        run: npm run lint

      - name: Commit & Push Updated Hub Parts and Compiled Data
        run: |
          git config user.name "Qualia Navi Auto Bot"
          git config user.email "bot@qualia-navi.example.com"
          git add content/hub-items/ content/hub-pages/ src/data.ts public/data/blogs.json public/sitemap.xml
          if git diff --staged --quiet; then
            echo "ℹ️ 本日分の更新・変更はありませんでした。"
            exit 0
          fi
          git commit -m "feat(hubs): auto update monthly cosme hubs (max 3 genres) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && break || sleep 3
          done


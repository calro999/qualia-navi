<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="32" fill="none" stroke="#f43f5e" stroke-width="4" stroke-opacity="0.25" />

  <!-- Decorative Sparkles -->
  <circle cx="1060" cy="120" r="80" fill="#f43f5e" fill-opacity="0.08" />
  <circle cx="140" cy="520" r="100" fill="#ec4899" fill-opacity="0.06" />

  <!-- Badge -->
  <rect x="80" y="80" width="280" height="46" rx="23" fill="url(#badgeGrad)" />
  <text x="220" y="110" font-family="'Zen Kaku Gothic New', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">✨ QUALIA NAVI</text>

  <!-- Title -->
  <text x="80" y="230" font-family="'Zen Kaku Gothic New', -apple-system, sans-serif" font-weight="900" font-size="54" fill="#0f172a" letter-spacing="-1">
    失敗しないコスメ選びをサポート
  </text>
  <text x="80" y="300" font-family="'Zen Kaku Gothic New', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#e11d48">
    プチプラ・デパコス・韓国コスメ徹底比較メディア
  </text>

  <!-- Subtitle -->
  <text x="80" y="380" font-family="'Zen Kaku Gothic New', -apple-system, sans-serif" font-weight="500" font-size="24" fill="#475569">
    専属アナリスト12名が実地検証！成分・使用感・楽天市場のリアルタイム最安値を網羅
  </text>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(80, 450)">
    <rect x="0" y="0" width="220" height="70" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
    <text x="110" y="32" font-family="'Zen Kaku Gothic New', sans-serif" font-weight="700" font-size="14" fill="#64748b" text-anchor="middle">検証記事数</text>
    <text x="110" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#e11d48" text-anchor="middle">3,500+ 本</text>

    <rect x="240" y="0" width="220" height="70" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
    <text x="350" y="32" font-family="'Zen Kaku Gothic New', sans-serif" font-weight="700" font-size="14" fill="#64748b" text-anchor="middle">秋冬特集ガイド</text>
    <text x="350" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#e11d48" text-anchor="middle">360+ 本</text>

    <rect x="480" y="0" width="220" height="70" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
    <text x="590" y="32" font-family="'Zen Kaku Gothic New', sans-serif" font-weight="700" font-size="14" fill="#64748b" text-anchor="middle">ライバル対決比較</text>
    <text x="590" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#7c3aed" text-anchor="middle">230+ 本</text>

    <rect x="720" y="0" width="320" height="70" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
    <text x="880" y="32" font-family="'Zen Kaku Gothic New', sans-serif" font-weight="700" font-size="14" fill="#64748b" text-anchor="middle">楽天市場 価格・ポイント検証</text>
    <text x="880" y="58" font-family="'Zen Kaku Gothic New', sans-serif" font-weight="900" font-size="18" fill="#d97706" text-anchor="middle">リアルタイム毎日更新</text>
  </g>
</svg>

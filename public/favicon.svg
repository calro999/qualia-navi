<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>

  <!-- Background with Smooth Rounded Rect -->
  <rect width="100" height="100" rx="26" fill="url(#roseGrad)" />
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />

  <!-- Monogram "Q" for Qualia Navi -->
  <text x="50" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Q</text>

  <!-- Sparkle Accent -->
  <path d="M 72 20 L 74.5 28 L 83 30.5 L 74.5 33 L 72 41 L 69.5 33 L 61 30.5 L 69.5 28 Z" fill="url(#goldGrad)" />
  <circle cx="80" cy="18" r="2" fill="#fff" />
</svg>
